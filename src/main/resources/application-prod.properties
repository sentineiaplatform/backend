# --- Neon PostgreSQL (produção) ---
# Palavra-passe: export NEON_PASSWORD='...' (nunca commitar).
# Se a password foi partilhada em texto claro, gere uma nova no painel Neon.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Obrigatório em produção (≥32 bytes); exemplo: openssl rand -base64 48
sentineia.jwt.secret=${SENTINEIA_JWT_SECRET}

sentineia.bootstrap.enabled=${SENTINEIA_BOOTSTRAP_ENABLED:false}

# Lista separada por vírgulas (URL do frontend em produção)
sentineia.cors.allowed-origins=${SENTINEIA_CORS_ALLOWED_ORIGINS}

# Resend: use RESEND_API_KEY no ambiente (nunca commitar).
sentineia.resend.api-key=${RESEND_API_KEY}

# URL pública do frontend — obrigatória em produção para links nos e-mails (ex.: https://app.exemplo.com).
sentineia.password-reset.frontend-base-url=${SENTINEIA_PUBLIC_FRONTEND_URL}