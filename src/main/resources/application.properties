spring.application.name=sentineia-backend
server.port=8080

spring.datasource.url=jdbc:h2:mem:sentineia;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (HS256). Em produção use variável de ambiente e segredo forte (≥32 bytes).
# Opcional: prefixo base64: + valor Base64 decodificado para a chave binária.
sentineia.jwt.secret=dev-only-change-in-production-min-32-chars!!
sentineia.jwt.expiration-ms=86400000

# CORS (origens do Vite em dev; produção: URL do frontend)
sentineia.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Utilizador inicial quando a tabela users está vazia (H2 dev)
sentineia.bootstrap.enabled=true
sentineia.bootstrap.admin.email=admin@sentineia.com
sentineia.bootstrap.admin.password=admin12345
sentineia.bootstrap.admin.name=Administrador
