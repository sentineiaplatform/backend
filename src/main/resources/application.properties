# ===========================
# Configurações da Aplicação
# ===========================
spring.application.name=sentineia-backend
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# Configurações do Frontend/CORS
# ==============================
# URL base do frontend, definida por variável de ambiente
sentineia.frontend.base-url=${SENTINEIA_FRONTEND_BASE_URL}
# Origem permitida para CORS (usa o valor da base URL do frontend)
sentineia.cors.allowed-origins=${sentineia.frontend.base-url}

# ====================
# Configurações do JWT
# ====================
# Tempo de expiração do token JWT em milissegundos (24h)
sentineia.jwt.expiration-ms=86400000 
# Chave secreta para assinatura do JWT (NÃO compartilhe em produção!)
sentineia.jwt.secret=1c8e8a51-3918-43c7-abf0-c01a8c97dad9b3aa04b1c14d2f7b1fae

# ==========================
# Configurações do Resend API
# ==========================
# Chave da API do Resend, via variável de ambiente
sentineia.resend.api-key=${RESEND_API_KEY}
# E-mail do remetente para o Resend, via variável de ambiente
sentineia.resend.from=${RESEND_FROM}

# ==========================
# Configurações do Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


