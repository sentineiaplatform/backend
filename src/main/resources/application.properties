spring.application.name=sentineia-backend
server.port=8080

# dev = H2 (application-dev.properties) | prod = Neon PostgreSQL (application-prod.properties)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true


#jwt expiration time in milliseconds (1 day)
sentineia.jwt.expiration-ms=86400000 

sentineia.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173

# Resend (opcional): chave em sentineia.resend.api-key; remetente em sentineia.resend.from.
# O domínio do endereço "from" tem de estar verificado em https://resend.com/domains senão a API devolve 403.
# Em desenvolvimento pode usar: sentineia.resend.from=onboarding@resend.dev (conforme documentação Resend).
# Não coloque segredos no repositório — use variáveis de ambiente em produção.
sentineia.resend.api-key=
sentineia.resend.from=onboarding@resend.dev

# Recuperação de senha: URL do frontend para o link do e-mail (path pode ser /redefinir-senha).
sentineia.password-reset.frontend-base-url=http://localhost:5173
sentineia.password-reset.token-validity-minutes=60
sentineia.password-reset.reset-path=/redefinir-senha

# Auditoria HTTP: um evento por pedido (POST/PUT/PATCH/DELETE por defeito; GET opcional).
sentineia.audit.http.enabled=true
sentineia.audit.http.include-get=false
# Corpo JSON sanitizado no campo detail (desligado por defeito — RGPD / segredos).
sentineia.audit.http.include-payload=true
sentineia.audit.http.payload-max-chars=2000
